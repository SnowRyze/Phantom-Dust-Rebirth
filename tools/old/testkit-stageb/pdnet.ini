; pdnet settings (stage B test build: no Xbox Live, lobbies through Epic Online Services). Restart the game after editing.

; Your name as other players see it (max 32 characters). install.ps1 asks for it.
display_name=Player

; xbox=off: pdnet replaces Xbox Live entirely (no Xbox sign-in needed).
xbox=off

; eos=on: lobbies go through Epic Online Services, signed in with this PC's device ID (no Epic account needed).
; Needs eos.ini and EOSSDK-Win64-Shipping.dll in the game folder (install.ps1 copies both).
eos=on
eos_test=off

; direct = pdnet's own UDP connections between players during a match (no Teredo)
network_mode=direct

; Address other players use to reach this PC during a match.
;   auto     = this PC's network address (right for two PCs on the same home network)
;   1.2.3.4  = your public IP, if you are the host over the internet and have forwarded the ports below
advertise_ip=auto

; UDP ports. game_port must match the game's networkmanifest.xml.
; Internet play (not same network): the HOST forwards both of these UDP ports on their router.
game_port=43210
control_port=43211

qos_probes=5

; Debug only: fake second player inside your own game. Leave off for a real test.
test_peer=off
