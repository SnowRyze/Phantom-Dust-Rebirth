; pdnet settings. Change them in the game (multiplayer menu > Settings), or here and restart the game.

; Your name as other players see it (max 32 characters). Setup asks for it.
display_name=Player

; Nametags on dead bodies (Tag Team only). on: a defeated player keeps their nametag. off: it disappears (original game).
; In a lobby the HOST's setting applies to everyone; this line only matters when you host.
nametags_on_bodies=on
; Colour of a dead player's nametag (RRGGBB). FFE600 is yellow, FFFFFF the game's own white.
dead_nametag_color=FFE600
; Nametag colours of the other players (RRGGBB): teammates in Tag Team, and opponents in every game type.
ally_nametag_color=4FB4FF
enemy_nametag_color=FF5A5A

; --- Voice chat (lobby voice through Epic, no account needed) ---
; on/off: voice chat in lobbies.
voice_chat=on
; What the in-game voice option does:
;   mic: it is called "Mic" and turns only your microphone on/off. Hearing others: voice_listen.
;   classic: the original "Voice Chat" option. Off means you neither talk nor hear.
voice_mode=mic
; Hear other players, on/off (mic mode only).
voice_listen=on

; What the partner lock input does in a match (Controllers: RB). In the game: Multiplayer > Settings > Partner Aim.
;   modern: locks onto your partner. Press again to unlock. The enemy lock-on and switch target buttons go to an enemy.
;   classic: turns the original Lock Onto Partner option on/off, so switch target can also reach your partner.
partner_aim=modern
; Keyboard key: a letter, a digit, F1-F24, Tab, Space, Shift, Ctrl, Alt, CapsLock and so on. none turns the key off.
; In the game: Main menu > Options > Keyboard > Lock Onto Partner.
partner_lock_key=Tab

; Volume at start: % of your last Volume Mixer level, until you are past the title screen.
splash_volume=40

; Discord: when you host, your game posts "lobby opened / players / closed" to this channel webhook.
; Empty: no Discord messages.
discord_webhook=
; on/off: "lobby opened / closed" messages, and "<player> joined / left" messages.
discord_lobby_messages=on
discord_player_messages=on

; Discord: Options, Send Log uploads your game logs to this channel webhook.
; Empty: Send Log is not set up.
log_webhook=

; Discord: the main menu's Community button opens this invite link.
discord_invite=

; Updates: at game start the game installs newer versions from GitHub by itself.
; stable, experimental or off. Empty: this kit's own kind (Experimental kits follow experimental).
; Main menu > Options > Updates switches it in the game (that choice wins over this line).
update_channel=
