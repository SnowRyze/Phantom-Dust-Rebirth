; pdnet settings (stage C test build: no Xbox Live, lobbies AND matches through Epic Online Services). Restart the game after editing.

; Your name as other players see it (max 32 characters). install.ps1 asks for it.
display_name=Player

; xbox=off: pdnet replaces Xbox Live entirely (no Xbox sign-in needed).
xbox=off

; eos=on: Epic Online Services, signed in with this PC's device ID (no Epic account needed).
; Needs eos.ini and EOSSDK-Win64-Shipping.dll in the game folder (install.ps1 copies both).
eos=on
eos_test=off

; eos = match traffic goes through Epic's P2P service: it connects players through home routers by itself,
;       and uses Epic's relay servers when a direct connection isn't possible. No port forwarding needed.
;       Both players must use this setting (and this kit).
; direct = pdnet's own direct UDP (needs port forwarding over the internet); teredo = original Microsoft networking.
network_mode=eos

; Nametags on dead bodies (Tag Team only): on = a defeated player keeps their nametag, off = it disappears (original game).
; In a lobby the HOST's setting applies to everyone; this line only matters when you host.
nametags_on_bodies=on
; Nametag colours on/off: off = every nametag in the game's own white (the colours below are ignored).
nametag_colors=on
; Colour of a dead player's nametag (RRGGBB). FFE600 = yellow.
dead_nametag_color=FFE600
; Nametag colours of the other players (RRGGBB): teammates in Tag Team, and opponents in every game type.
ally_nametag_color=4FB4FF
enemy_nametag_color=FF5A5A

; In the multiplayer lobby, the Invite button opens the Arsenal editor (on/off).
lobby_arsenal_editor=on

; Lobby Options > Gamertag can be opened even when you're alone in the lobby (on/off).
lobby_gamertag_option=on

; Voice chat (Epic voice room in each lobby, no account needed): on/off. The lobby's Mic option switches only
; your microphone; voice_listen=on means you hear the other players.
voice_chat=on
voice_listen=on
; Lobby mic indicator: MNET sprite after the name of each player whose mic is on (36 = the original megaphone).
voice_talk_icon=36
; Or -1 above for a blinking text mark after a talking player's name instead: any text, or #N for the game's inline icon N.
voice_talk_mark=♪

; Volume (pdlaunch): Windows resets the game's Volume Mixer level to 100% at every start, and the game only applies
; its own sound settings after the splash screen. remember_volume=on brings back your last Volume Mixer level;
; splash_volume = % of that level for the first splash_seconds (the logos).
remember_volume=on
splash_volume=40
splash_seconds=12

; Discord: when you host, your game posts "lobby opened / players / closed" to this channel webhook.
; Empty = no Discord messages. make-testkit.ps1 fills it in.
discord_webhook=
; on/off: "lobby opened / closed" messages, and "<player> joined / left" messages.
discord_lobby_messages=on
discord_player_messages=on

; Epic relay use: allow (normal), force (always relay; only for testing), off (never relay).
p2p_relay=allow

; Only used by the direct mode and as a fallback. Leave as they are.
advertise_ip=auto
game_port=43210
control_port=43211
qos_probes=5

; Debug only: fake second player inside your own game. Leave off for a real test.
test_peer=off
