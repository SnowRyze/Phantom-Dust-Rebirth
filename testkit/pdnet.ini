; pdnet settings (direct peer-to-peer test build). Restart the game after editing.

; direct = pdnet direct UDP connections (no Teredo)
; teredo = original Microsoft Teredo / Xbox Secure Device Association
network_mode=direct

; Address other players use to reach this PC.
;   auto     = this PC's network address (right for two PCs on the same home network)
;   1.2.3.4  = your public IP, if you are the host over the internet and have forwarded the ports below
advertise_ip=auto

; UDP ports. game_port must match the game's networkmanifest.xml.
; Internet play (not same network): the HOST forwards both of these UDP ports on their router.
game_port=43210
control_port=43211

qos_probes=5

; Debug only: fake second player that joins your own lobby (results in pdnet.log). Leave off for a real test.
test_peer=off
